openapi: "3.1.0"
info:
  title: "AiForDev API"
  version: "0.1.0"
  description: "REST API for the AiForDevelopers platform"
servers:
  - url: "http://localhost:8080/api"
    description: "Local backend"
security:
  - bearerAuth: []
tags:
  - name: auth
    description: "Authentication & registration"
  - name: users
    description: "User profile"
  - name: schedules
    description: "Schedule & availability management"
  - name: calendar
    description: "Google Calendar integration"
  - name: eventTypes
    description: "Event type management"
  - name: bookings
    description: "Booking management"
  - name: public
    description: "Public endpoints (no auth)"
  - name: contacts
    description: "Contact management"
paths:
  /api/auth/register:
    $ref: "./paths/auth.yaml#/paths/~1api~1auth~1register"
  /api/auth/login:
    $ref: "./paths/auth.yaml#/paths/~1api~1auth~1login"
  /api/auth/refresh:
    $ref: "./paths/auth.yaml#/paths/~1api~1auth~1refresh"
  /api/auth/oauth2/google:
    $ref: "./paths/auth.yaml#/paths/~1api~1auth~1oauth2~1google"
  /api/auth/oauth2/google/callback:
    $ref: "./paths/auth.yaml#/paths/~1api~1auth~1oauth2~1google~1callback"
  /api/me:
    $ref: "./paths/users.yaml#/paths/~1api~1me"
  /api/schedules:
    $ref: "./paths/schedules.yaml#/paths/~1api~1schedules"
  /api/schedules/{id}:
    $ref: "./paths/schedules.yaml#/paths/~1api~1schedules~1{id}"
  /api/calendar/google/connect:
    $ref: "./paths/calendar.yaml#/paths/~1api~1calendar~1google~1connect"
  /api/calendar/google/callback:
    $ref: "./paths/calendar.yaml#/paths/~1api~1calendar~1google~1callback"
  /api/calendar/google/status:
    $ref: "./paths/calendar.yaml#/paths/~1api~1calendar~1google~1status"
  /api/calendar/google/events:
    $ref: "./paths/calendar.yaml#/paths/~1api~1calendar~1google~1events"
  /api/calendar/google/events/{googleEventId}:
    $ref: "./paths/calendar.yaml#/paths/~1api~1calendar~1google~1events~1{googleEventId}"
  /api/event-types:
    $ref: "./paths/event-types.yaml#/paths/~1api~1event-types"
  /api/event-types/{id}:
    $ref: "./paths/event-types.yaml#/paths/~1api~1event-types~1{id}"
  /api/event-types/{id}/availability:
    $ref: "./paths/availability.yaml#/paths/~1api~1event-types~1{id}~1availability"
  /api/public/{userId}/{slug}:
    $ref: "./paths/public.yaml#/paths/~1api~1public~1{userId}~1{slug}"
  /api/bookings:
    $ref: "./paths/bookings.yaml#/paths/~1api~1bookings"
  /api/bookings/{id}:
    $ref: "./paths/bookings.yaml#/paths/~1api~1bookings~1{id}"
  /api/contacts:
    $ref: "./paths/contacts.yaml#/paths/~1api~1contacts"
  /api/contacts/{id}:
    $ref: "./paths/contacts.yaml#/paths/~1api~1contacts~1{id}"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
