paths:
  /api/contacts:
    get:
      tags:
        - contacts
      summary: List contacts
      operationId: listContacts
      parameters:
        - name: favorite
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../components/schemas/contact.yaml#/ContactResponse"
        "401":
          description: Unauthorized
  /api/contacts/{id}:
    get:
      tags:
        - contacts
      summary: Get contact by ID
      operationId: getContact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Contact details
          content:
            application/json:
              schema:
                $ref: "../components/schemas/contact.yaml#/ContactResponse"
        "401":
          description: Unauthorized
        "404":
          description: Contact not found
    patch:
      tags:
        - contacts
      summary: Update contact favorite status
      operationId: updateContactFavorite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../components/schemas/contact.yaml#/UpdateFavoriteRequest"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "../components/schemas/contact.yaml#/ContactResponse"
        "401":
          description: Unauthorized
        "404":
          description: Contact not found
